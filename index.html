<script>
const $=id=>document.getElementById(id),cv=$('cv'),cx=cv.getContext('2d'),wrap=$('wrap');
const ex=document.createElement('canvas'),ec=ex.getContext('2d'),tmp=document.createElement('canvas'),tc=tmp.getContext('2d');
let media=null,isVid=false,W=0,H=0,items=[],sel=null,s=1,ox=0,oy=0,dpr=1,rec=null,seeking=false;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const defAdj=()=>({br:100,co:100,sa:100,hu:0,bl:0,se:0,gr:0,iv:0});
let MD=[],MI=0,IM=[],ct=0,bgSel='#000000',bgCv=null,adj=defAdj(),brush=false,h1=[],h2=[],last='';
const AL={br:['Яркость',0,200],co:['Контраст',0,200],sa:['Насыщ.',0,300],hu:['Оттенок',-180,180],bl:['Размытие',0,20],se:['Сепия',0,100],gr:['Ч/Б',0,100],iv:['Негатив',0,100]};
const PR={'Оригинал':{},'Ч/Б':{gr:100},'Сепия':{se:100},'Яркий':{co:115,sa:140},'Холод':{hu:-20,sa:110,br:105},'Тёплый':{hu:15,se:30,sa:115},'Драма':{co:140,sa:80,br:90},'Негатив':{iv:100}};
const fstr=()=>(adj.br==100&&adj.co==100&&adj.sa==100&&!adj.hu&&!adj.bl&&!adj.se&&!adj.gr&&!adj.iv)?'none':`brightness(${adj.br}%) contrast(${adj.co}%) saturate(${adj.sa}%) hue-rotate(${adj.hu}deg) blur(${adj.bl*W/1000}px) sepia(${adj.se}%) grayscale(${adj.gr}%) invert(${adj.iv}%)`;
const state=()=>JSON.stringify({items,adj,md:MI,W,H});
function commit(){const j=state();if(j!==last){h1.push(last);if(h1.length>100)h1.shift();h2=[];last=j}}
function restore(j){const o=JSON.parse(j);if(MD[o.md]&&o.md!==MI){MI=o.md;media=MD[MI];W=o.W;H=o.H;ex.width=W;ex.height=H}items=o.items;adj=o.adj;sel=null;syncAdj();ui()}
function undo(){if(!h1.length)return;h2.push(last);last=h1.pop();restore(last)}
function redo(){if(!h2.length)return;h1.push(last);last=h2.pop();restore(last)}
const syncAdj=()=>document.querySelectorAll('[data-a]').forEach(r=>r.value=adj[r.dataset.a]);
for(const n in PR){const b=document.createElement('button');b.textContent=n;b.onclick=()=>{adj=Object.assign(defAdj(),PR[n]);syncAdj();commit()};$('pr').appendChild(b)}
for(const k in AL){const[l,a,z]=AL[k],d=document.createElement('label');d.innerHTML=`<span style="width:80px">${l}</span><input type=range min=${a} max=${z} data-a=${k} style="flex:1">`;const r=d.lastChild;r.oninput=()=>adj[k]=+r.value;r.onchange=commit;$('sl').appendChild(d)}
syncAdj();
document.querySelectorAll('[data-k]').forEach(el=>el.onchange=commit);
function pathStroke(c,it){c.lineWidth=it.z;c.lineCap=c.lineJoin='round';c.beginPath();it.p.forEach((p,i)=>i?c.lineTo(p[0],p[1]):c.moveTo(p[0],p[1]));if(it.p.length==1)c.lineTo(it.p[0][0]+.01,it.p[0][1]);c.stroke()}
const BC=new WeakMap();
function drawBlurStroke(c,it,ix){
 const below=items.slice(0,ix).filter(i=>i.t=='img');
 const sg=[it.p.length,it.p[0],it.k,it.z,fstr(),isVid?media.currentTime:0,below.map(i=>[i.id,i.x,i.y,i.w,i.a].join()).join(';')].join('|');
 let e=BC.get(it);
 if(!e||e.sg!==sg){
  const b=bounds(it),bx=Math.max(0,Math.floor(b.x)),by=Math.max(0,Math.floor(b.y)),bw=Math.min(W,Math.ceil(b.x+b.w))-bx,bh=Math.min(H,Math.ceil(b.y+b.h))-by;
  if(bw<1||bh<1)return;
  const cv2=e?e.cv:document.createElement('canvas');cv2.width=bw;cv2.height=bh;
  const g=cv2.getContext('2d'),m=Math.ceil(it.k*2),sx=Math.max(0,bx-m),sy=Math.max(0,by-m),sw=Math.min(W,bx+bw+m)-sx,sh=Math.min(H,by+bh+m)-sy;
  g.translate(-bx,-by);g.strokeStyle='#000';pathStroke(g,it);
  g.globalCompositeOperation='source-in';g.filter=fstr()+` blur(${it.k}px)`;g.drawImage(media,sx,sy,sw,sh,sx,sy,sw,sh);
  g.globalCompositeOperation='source-atop';g.filter=`blur(${it.k}px)`;
  for(const i of below){g.globalAlpha=i.a??1;g.drawImage(IM[i.id],i.x,i.y,i.w,i.h)}
  e={sg,cv:cv2,bx,by};BC.set(it,e)
 }
 c.drawImage(e.cv,e.bx,e.by)
}
function addImg(f){return new Promise(r=>{const i=new Image();i.onload=()=>{const id=IM.push(i)-1,ar=i.naturalWidth/i.naturalHeight,rc=wrap.getBoundingClientRect(),vw=Math.min(W,rc.width/s)*.5,o=(ct++%8)*vw*.04,vx=(rc.width/2-ox)/s+o,vy=(rc.height/2-oy)/s+o;const it={t:'img',id,ar,x:vx-vw/2,y:vy-vw/ar/2,w:vw,h:vw/ar};items.push(it);sel=it;ui();commit();r()};i.onerror=r;i.src=URL.createObjectURL(f)})}
$('ad').onclick=()=>$('fa').click();
$('fa').onchange=async e=>{for(const f of e.target.files)await addImg(f);e.target.value=''};
$('up').onclick=()=>{const i=items.indexOf(sel);if(sel&&i<items.length-1){[items[i],items[i+1]]=[items[i+1],items[i]];commit()}};
$('dn').onclick=()=>{const i=items.indexOf(sel);if(sel&&i>0){[items[i],items[i-1]]=[items[i-1],items[i]];commit()}};
const BGS=['#000000','#ffffff','#ff3b30','#ff9500','#ffcc00','#34c759','#00c7be','#007aff','#5856d6','#af52de','#ff2d55','#8e8e93','#1c1c1e','#f2e8cf','#ffc8dd','#a2d2ff','g:#ff512f,#dd2476','g:#4776e6,#8e54e4','g:#11998e,#38ef7d','g:#fc4a1a,#f7b733','g:#232526,#414345','g:#ee9ca7,#ffdde1'];
function fillBg(c){const g=c.getContext('2d');let f=bgSel;if(f[0]=='g'){const[a,b]=f.slice(2).split(','),gr=g.createLinearGradient(0,0,c.width,c.height);gr.addColorStop(0,a);gr.addColorStop(1,b);f=gr}g.fillStyle=f;g.fillRect(0,0,c.width,c.height)}
function mkBg(){const[w,h]=$('bz').value.split('x').map(Number),c=document.createElement('canvas');c.width=w;c.height=h;fillBg(c);bgCv=c;setM(c,false,w,h)}
BGS.forEach(v=>{const b=document.createElement('button');b.style.background=v[0]=='g'?`linear-gradient(135deg,${v.slice(2)})`:v;b.onclick=()=>{bgSel=v;if(bgCv&&media===bgCv)fillBg(bgCv);else mkBg()};$('sw').appendChild(b)});
$('bz').onchange=()=>{const k=items,m=IM;mkBg();items=k;IM=m;commit()};
$('bgb').onclick=()=>{$('gp').hidden=!$('gp').hidden};
const kA=a=>{a=Math.abs(a);return Math.cos(a)+Math.sin(a)*Math.max(W/H,H/W)};
const nc=(w,h)=>{const n=document.createElement('canvas');n.width=w;n.height=h;return n};
function bake(fn){if(isVid||!media)return;paint(ec);const c=nc(W,H);c.getContext('2d').drawImage(ex,0,0);const n=fn(c);MD.push(n);MI=MD.length-1;media=n;W=n.width;H=n.height;ex.width=W;ex.height=H;items=[];adj=defAdj();syncAdj();sel=null;$('an').value=0;$('av').textContent='0°';fit();ui();commit()}
$('cb').onclick=()=>{if(!media||isVid)return;const it={t:'crop',x:W*.1,y:H*.1,w:W*.8,h:H*.8};items.push(it);sel=it;ui()};
document.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{const it=sel;if(!it||it.t!='crop')return;const r=+b.dataset.r;let w=W,h=H;if(r){w=Math.min(W,H*r);h=w/r}it.w=w;it.h=h;it.x=(W-w)/2;it.y=(H-h)/2});
$('cr').onclick=()=>{const it=sel;if(!it||it.t!='crop')return;const x=Math.round(Math.max(0,it.x)),y=Math.round(Math.max(0,it.y)),w=Math.round(Math.min(W,it.x+it.w))-x,h=Math.round(Math.min(H,it.y+it.h))-y;if(w<2||h<2)return;bake(c=>{const n=nc(w,h);n.getContext('2d').drawImage(c,x,y,w,h,0,0,w,h);return n})};
$('tb').onclick=()=>{$('tf').hidden=!$('tf').hidden};
$('r1').onclick=()=>bake(c=>{const n=nc(c.height,c.width),g=n.getContext('2d');g.translate(0,c.width);g.rotate(-Math.PI/2);g.drawImage(c,0,0);return n});
$('r2').onclick=()=>bake(c=>{const n=nc(c.height,c.width),g=n.getContext('2d');g.translate(c.height,0);g.rotate(Math.PI/2);g.drawImage(c,0,0);return n});
$('fh').onclick=()=>bake(c=>{const n=nc(c.width,c.height),g=n.getContext('2d');g.translate(c.width,0);g.scale(-1,1);g.drawImage(c,0,0);return n});
$('fv').onclick=()=>bake(c=>{const n=nc(c.width,c.height),g=n.getContext('2d');g.translate(0,c.height);g.scale(1,-1);g.drawImage(c,0,0);return n});
$('an').oninput=()=>{$('av').textContent=$('an').value+'°'};
$('ah').onclick=()=>{const a=+$('an').value*Math.PI/180;if(!a)return;bake(c=>{const n=nc(c.width,c.height),g=n.getContext('2d'),k=kA(a);g.translate(c.width/2,c.height/2);g.rotate(a);g.scale(k,k);g.drawImage(c,-c.width/2,-c.height/2);return n})};
$('bt').onclick=()=>{brush=!brush;sel=null;$('bp').hidden=!brush;$('bt').style.background=brush?'#7c5cff':'';ui()};
$('at').onclick=()=>{$('ap').hidden=!$('ap').hidden};
$('un').onclick=undo;$('re').onclick=redo;
addEventListener('keydown',e=>{if(e.ctrlKey&&e.key=='z'){e.preventDefault();undo()}if(e.ctrlKey&&e.key=='y'){e.preventDefault();redo()}});
function resize(){const r=wrap.getBoundingClientRect();dpr=devicePixelRatio||1;cv.width=Math.round(r.width*dpr);cv.height=Math.round(r.height*dpr)}
new ResizeObserver(resize).observe(wrap);
function fit(){const r=wrap.getBoundingClientRect();s=Math.min(r.width/W,r.height/H)*.95;ox=(r.width-W*s)/2;oy=(r.height-H*s)/2}
function load(f){
 const u=URL.createObjectURL(f);
 if(f.type.startsWith('video')){const v=document.createElement('video');v.src=u;v.playsInline=true;v.loop=true;v.preload='auto';
  v.onloadedmetadata=()=>{v.currentTime=.01;setM(v,true,v.videoWidth,v.videoHeight)};v.onerror=()=>alert('Не удалось открыть видео')}
 else{const i=new Image();i.onload=()=>setM(i,false,i.naturalWidth,i.naturalHeight);i.onerror=()=>alert('Не удалось открыть фото');i.src=u}
}
function setM(m,v,w,h){media=m;isVid=v;W=w;H=h;items=[];sel=null;MD=[m];MI=0;IM=[];adj=defAdj();syncAdj();h1=[];h2=[];last=state();ex.width=W;ex.height=H;$('kk').max=Math.round(Math.max(W,H)/10);fit();ui()}
function ui(){
 const g=(c,on)=>document.querySelectorAll('.'+c).forEach(e=>e.hidden=!on);
 $('pn').hidden=!sel;g('g-txt',sel&&sel.t=='txt');g('g-bar',sel&&sel.t=='bar');g('g-fx',sel&&(sel.t=='pix'||sel.t=='blur'));g('g-crop',sel&&sel.t=='crop');
 $('vb').hidden=!isVid;$('fr').hidden=!isVid;
 if(sel)document.querySelectorAll('[data-k]').forEach(e=>{const v=sel[e.dataset.k];if(v===undefined){if(e.dataset.k=='a')e.value=1;return}if(e.type=='checkbox')e.checked=v;else e.value=v});
}
document.querySelectorAll('[data-k]').forEach(el=>el.oninput=()=>{if(!sel)return;sel[el.dataset.k]=el.type=='checkbox'?el.checked:el.type=='range'?+el.value:el.value});
$('ff').onchange=async e=>{const f=e.target.files[0];if(!f)return;const n='F'+Date.now();const face=new FontFace(n,await f.arrayBuffer());await face.load();document.fonts.add(face);const fn=$('fn');fn.add(new Option(f.name.replace(/\.\w+$/,''),n));fn.value=n;fn.oninput()};
document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{
 if(!media)return;const r=wrap.getBoundingClientRect(),vx=(r.width/2-ox)/s,vy=(r.height/2-oy)/s,vw=Math.min(W,r.width/s)*.4,vh=Math.min(H,r.height/s)*.12,t=b.dataset.add;let it;
 if(t=='txt')it={t,s:'Текст',f:'Impact',c:'#ffffff',g:false,c2:'#ff4fd8',oc:'#000000',ow:6,sh:0,b:false,i:false,x:vx,y:vy,z:Math.max(4,Math.min(H/10,r.height/s/5))};
 else it={t,c:'#000000',k:Math.max(2,Math.max(W,H)/60),x:vx-vw/2,y:vy-vh/2,w:vw,h:vh};
 items.push(it);sel=it;ui();commit()});
function del(){if(!sel)return;items=items.filter(i=>i!==sel);sel=null;ui();commit()}
$('del').onclick=del;addEventListener('keydown',e=>{if(e.key=='Delete'&&!/TEXTAREA|INPUT/.test(e.target.tagName))del()});
$('op').onclick=()=>$('fi').click();$('fi').onchange=e=>{if(e.target.files[0])load(e.target.files[0]);e.target.value=''};
$('ft').onclick=()=>media&&fit();
$('pl').onclick=()=>media.paused?media.play():media.pause();

function setFont(c,it){c.font=`${it.i?'italic ':''}${it.b?'bold ':''}${it.z}px "${it.f}",sans-serif`}
function bounds(it){if(it.t=='str'){let a=1e9,b=1e9,c=-1e9,d=-1e9;for(const p of it.p){a=Math.min(a,p[0]);b=Math.min(b,p[1]);c=Math.max(c,p[0]);d=Math.max(d,p[1])}return{x:a-it.z/2,y:b-it.z/2,w:c-a+it.z,h:d-b+it.z}}if(it.t!='txt')return it;setFont(tc,it);const L=it.s.split('\n');let w=0;for(const l of L)w=Math.max(w,tc.measureText(l).width);const h=L.length*it.z*1.2;return{x:it.x-w/2,y:it.y-h/2,w,h}}
const corners=b=>[[b.x,b.y],[b.x+b.w,b.y],[b.x+b.w,b.y+b.h],[b.x,b.y+b.h]];
function drawText(c,it){
 setFont(c,it);c.textAlign='center';c.textBaseline='middle';c.lineJoin='round';
 const L=it.s.split('\n'),lh=it.z*1.2,y0=it.y-(L.length-1)*lh/2;
 L.forEach((l,k)=>{const y=y0+k*lh;
  if(it.g){const g=c.createLinearGradient(0,y-lh/2,0,y+lh/2);g.addColorStop(0,it.c);g.addColorStop(1,it.c2);c.fillStyle=g}else c.fillStyle=it.c;
  c.save();
  if(it.sh){c.shadowColor=it.oc;c.shadowBlur=it.z*it.sh/10}
  if(it.ow){c.lineWidth=it.z*it.ow/40;c.strokeStyle=it.oc;c.strokeText(l,it.x,y)}
  c.fillText(l,it.x,y);c.restore()})
}
function paint(c){
 c.save();c.filter=fstr();c.drawImage(media,0,0,W,H);c.restore();
 for(let ix=0;ix<items.length;ix++){const it=items[ix];c.globalAlpha=it.a??1;
